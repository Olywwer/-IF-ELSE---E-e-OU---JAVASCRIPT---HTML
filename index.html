<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">

   
    <div class="text-center mb-4">
        <button class="btn btn-primary me-2" onclick="mostrarAposentadoria()">Aposentadoria</button>
        <button class="btn btn-success" onclick="mostrarIMC()">IMC</button>
    </div>

    
    <div id="aposentadoria" class="card p-4 shadow card-bg" style="display:none;">
        <h3 class="mb-3 text-center text-white">Aposentadoria</h3>

        <input type="number" id="idade" class="form-control mb-2" placeholder="Idade">
        <input type="number" id="contribuicao" class="form-control mb-3" placeholder="Tempo de contribuição">

        <button class="btn btn-primary w-100" onclick="verificar()">Verificar</button>

        <p id="resultadoAposentadoria" class="mt-3 text-center fw-bold"></p>
    </div>

    <div id="imc" class="card p-4 shadow card-bg" style="display:none;">
        <h3 class="mb-3 text-center text-white">Calculadora de IMC</h3>

        <input type="number" id="altura" class="form-control mb-2" placeholder="Altura (ex: 1.70)">
        <input type="number" id="peso" class="form-control mb-3" placeholder="Peso (kg)">

        <button class="btn btn-success w-100" onclick="calcularIMC()">Calcular</button>

        <p id="resultadoIMC" class="mt-3 text-center fw-bold"></p>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
